name: Publish npm package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Show npm version
        run: npm --version

      - name: Run release checks
        run: |
          version="$(node --print "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v${version}"
          fi
          npm test
          npm pack --dry-run --json > "$RUNNER_TEMP/package-manifest.json"
          node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"

      - name: Check whether this version is unpublished
        id: version
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          if published="$(npm view "jhste-skills@${version}" version 2>npm-view.err)"; then
            test "$published" = "$version"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "jhste-skills@${version} is already published"
          elif grep -q 'E404' npm-view.err; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "jhste-skills@${version} will be published"
          else
            cat npm-view.err >&2
            exit 1
          fi

      - name: Publish to npm with trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Verify the published npm version
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          published=""
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "jhste-skills@${version}" version 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              echo "Verified jhste-skills@${version} on npm"
              exit 0
            fi
            echo "Registry verification attempt ${attempt} did not return ${version}"
            sleep 10
          done
          echo "Expected jhste-skills@${version}; registry returned ${published:-nothing}" >&2
          exit 1

      - name: Verify published tarball integrity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const [expected] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/package-manifest.json`, 'utf8'));
          const published = JSON.parse(execFileSync('npm', ['view', `jhste-skills@${version}`, 'dist.integrity', '--json'], { encoding: 'utf8' }));
          if (!expected.integrity || published !== expected.integrity) {
            throw new Error(`Published tarball does not match the checked source for ${version}`);
          }
          console.log(`Verified tarball integrity for jhste-skills@${version}: ${published}`);
          NODE

      - name: Create GitHub release from CHANGELOG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = `v${version}`;
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const existing = await fetch(`${endpoint}/tags/${encodeURIComponent(tag)}`, { headers });
          let release;
          if (existing.ok) {
            release = await existing.json();
            if (release.draft || release.prerelease) {
              throw new Error(`Existing ${tag} is not a published stable release`);
            }
            console.log(`Preserving existing release ${tag}`);
          } else if (existing.status === 404) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                tag_name: tag,
                target_commitish: process.env.GITHUB_SHA,
                name: `jhste-skills ${version}`,
                body: readFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, 'utf8'),
                draft: false,
                prerelease: false,
                make_latest: 'true',
              }),
            });
            if (!response.ok) {
              throw new Error(`GitHub release API returned ${response.status}: ${await response.text()}`);
            }
            release = await response.json();
          } else {
            throw new Error(`GitHub release lookup returned ${existing.status}: ${await existing.text()}`);
          }
          if (release.tag_name !== tag) throw new Error(`Unexpected release tag: ${release.tag_name}`);
          console.log(release.html_url);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Published and verified jhste-skills@${version}.\n\nRelease: ${release.html_url}\n`);
          NODE

      - name: Record successful npm release status
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_STATE: success
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,
            {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({
                state: process.env.RELEASE_STATE,
                context: 'npm/publish',
                description: `Verified jhste-skills@${version} on npm`,
                target_url: runUrl,
              }),
            },
          );
          if (!response.ok) {
            throw new Error(`GitHub status API returned ${response.status}: ${await response.text()}`);
          }
          NODE

      - name: Record failed npm release status
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_STATE: failure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,
            {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({
                state: process.env.RELEASE_STATE,
                context: 'npm/publish',
                description: `npm release failed for jhste-skills@${version}`,
                target_url: runUrl,
              }),
            },
          );
          if (!response.ok) {
            throw new Error(`GitHub status API returned ${response.status}: ${await response.text()}`);
          }
          NODE
